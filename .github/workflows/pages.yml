name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The game's assets are not committed (see README), so they are fetched
      # from the original project and converted at build time. Cached so the
      # upstream tarball is only downloaded when the converter changes.
      - name: Cache converted assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: upstream-${{ hashFiles('tools/convert-assets.mjs') }}

      - name: Install dependencies and build assets
        run: node tools/setup.mjs

      - name: Build
        run: npm run build

      # enablement lets this workflow switch Pages to the "GitHub Actions"
      # build type itself, using the pages: write permission above. Without it
      # the step fails until that source is selected by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
