<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castlevania</title>
  <style>
    /* HUD font: the original's Fonts/MainFont.font.xml points at this .ttf.
       Copied into place by tools/convert-assets.mjs. */
    @font-face {
      font-family: 'prstartk';
      src: url('/assets/fonts/prstartk.ttf') format('truetype');
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
